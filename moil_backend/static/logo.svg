<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" fill="none">

  <!-- Calendar body -->
  <rect x="152" y="80" width="176" height="152" rx="18" fill="white" stroke="#D4DCE8" stroke-width="2.5"/>
  <!-- Blue calendar header -->
  <rect x="152" y="80" width="176" height="58" rx="18" fill="#5B8DEF"/>
  <rect x="152" y="114" width="176" height="24" fill="#5B8DEF"/>

  <!-- Binding rings -->
  <rect x="192" y="60" width="18" height="38" rx="9" fill="#1A202C"/>
  <rect x="270" y="60" width="18" height="38" rx="9" fill="#1A202C"/>

  <!-- ── Chart content inside calendar ── -->

  <!-- Pie chart (left-center) -->
  <!-- Yellow segment ~140deg -->
  <path d="M218 175 L218 143 A32 32 0 0 1 248 207 Z" fill="#F6C244"/>
  <!-- Pink/coral segment ~130deg -->
  <path d="M218 175 L248 207 A32 32 0 0 1 190 207 Z" fill="#F07070"/>
  <!-- Teal segment ~90deg -->
  <path d="M218 175 L190 207 A32 32 0 0 1 218 143 Z" fill="#4ECDC4"/>

  <!-- Bar chart (right side) -->
  <rect x="262" y="167" width="13" height="35" rx="3" fill="#4ECDC4"/>
  <rect x="279" y="152" width="13" height="50" rx="3" fill="#4CAF50"/>
  <rect x="296" y="160" width="13" height="42" rx="3" fill="#90CAF9"/>

  <!-- Scatter/trend line dots -->
  <circle cx="198" cy="143" r="5" fill="#F6C244"/>
  <circle cx="230" cy="132" r="5" fill="#5B8DEF"/>
  <circle cx="256" cy="150" r="5" fill="#F07070"/>
  <line x1="198" y1="143" x2="230" y2="132" stroke="#B8C5D6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="230" y1="132" x2="256" y2="150" stroke="#B8C5D6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ATTENDLY -->
  <text
    x="240" y="358"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="#2D3142"
    text-anchor="middle"
    letter-spacing="1"
  >ATTENDLY</text>

  <!-- SCHOOLS -->
  <text
    x="240" y="398"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="600"
    fill="#5B8DEF"
    text-anchor="middle"
    letter-spacing="10"
  >SCHOOLS</text>

</svg>
