<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<title>Sign In — Moil Primary School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
  background: #0D1117;
}

/* ── LEFT PANEL — school photo ── */
.login-photo {
  flex: 1 1 55%;
  position: relative;
  overflow: hidden;
  background: #0a1a0d;
}
.login-photo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
/* Dark gradient overlay so text is readable */
.login-photo-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(0,0,0,0.15) 0%,
    rgba(10,40,20,0.55) 60%,
    rgba(5,25,10,0.80) 100%
  );
}
.login-photo-content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 48px 44px;
  color: white;
}
.login-photo-logo {
  margin-bottom: 20px;
}
.login-photo-logo img {
  height: 56px;
  width: auto;
  background: white;
  border-radius: 10px;
  padding: 6px 12px;
}
.login-photo-school {
  font-size: 26px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 8px;
  letter-spacing: -0.3px;
}
.login-photo-tagline {
  font-size: 14px;
  color: rgba(255,255,255,0.70);
  font-weight: 400;
}

/* ── RIGHT PANEL — form ── */
.login-right {
  flex: 0 0 440px;
  background: #111827;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 44px;
  position: relative;
  border-left: 1px solid rgba(255,255,255,0.06);
}
.login-right-inner {
  width: 100%; max-width: 340px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
}

.school-name-top {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.4px;
  margin-bottom: 6px;
}
.card-eyebrow {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #4ADE80;
  margin-bottom: 10px;
}
.card-title {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.card-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 28px;
  line-height: 1.5;
}

/* Error alert */
.login-error {
  background: #FEF2F2;
  border: 1px solid #FECACA;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 13px;
  color: #DC2626;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Form */
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.55);
  margin-bottom: 6px;
  letter-spacing: 0.2px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 9px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: rgba(255,255,255,0.07);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  -webkit-appearance: none;
}
.form-input:focus {
  outline: none;
  border-color: #4ADE80;
  background: rgba(255,255,255,0.09);
  box-shadow: 0 0 0 3px rgba(74,222,128,0.14);
}
.form-input::placeholder { color: rgba(255,255,255,0.25); }

/* Input with icon */
.input-wrap { position: relative; }
.input-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.3);
  pointer-events: none;
}
.input-icon svg { width: 16px; height: 16px; }
.input-wrap .form-input { padding-left: 38px; }

/* Submit */
.btn-login {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #15803D, #16A34A);
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 10px rgba(22,163,74,0.30);
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover {
  background: linear-gradient(135deg, #166534, #15803D);
  box-shadow: 0 4px 18px rgba(22,163,74,0.40);
  transform: translateY(-1px);
}
.btn-login:active { transform: translateY(0); }

/* Footer */
.login-footer {
  position: absolute;
  bottom: 20px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
}

/* Responsive — stack on small screens */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .login-photo {
    flex: 0 0 220px;
    min-height: 220px;
  }
  .login-photo-content { padding: 24px; }
  .login-photo-school { font-size: 20px; }
  .login-right {
    flex: 1;
    padding: 36px 20px;
    border-left: none;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
}
</style>
</head>
<body>

<!-- LEFT: school photo -->
<div class="login-photo">
  <img class="login-photo-img" src="{{ url_for('static', filename='school-bg.jpg') }}" alt="Moil Primary School">
  <div class="login-photo-overlay"></div>
  <div class="login-photo-content">
    <div class="login-photo-logo">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Moil Primary School">
    </div>
    <div class="login-photo-school">Moil Primary School</div>
    <div class="login-photo-tagline">Attendance Management System</div>
  </div>
</div>

<!-- RIGHT: login form -->
<div class="login-right">
  <div class="login-right-inner">

    <div class="school-name-top">Moil Primary School</div>
    <div class="card-eyebrow">Staff Portal</div>
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in with your school account to continue.</div>

    {% if error %}
    <div class="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="form-input" type="text" id="username" name="username"
                 placeholder="Enter your username" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>

  </div>
  <div class="login-footer">&copy; 2026 Moil Primary School</div>
</div>

</body>
</html>
