<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<title>Sign In — Attendly Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #F3F6FB;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(29,78,216,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29,78,216,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.login-wrap {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* Brand header */
.login-brand {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo {
  margin-bottom: 10px;
}
.login-logo img { height: 180px; width: auto; display: block; margin: 0 auto; }
.login-brand h1 { display: none; }
.login-brand p  { font-size: 13px; color: #64748B; margin-top: 2px; }

/* Card */
.login-card {
  background: white;
  border-radius: 16px;
  border: 1px solid #E1E8F0;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
  padding: 32px;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: #1E293B;
  margin-bottom: 6px;
}
.card-sub {
  font-size: 13px;
  color: #64748B;
  margin-bottom: 24px;
}

/* Error alert */
.login-error {
  background: #FEF2F2;
  border: 1px solid #FECACA;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 13px;
  color: #DC2626;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 6px;
  letter-spacing: 0.1px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #E1E8F0;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #1E293B;
  background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
.form-input:focus {
  outline: none;
  border-color: #1D4ED8;
  box-shadow: 0 0 0 3px rgba(29,78,216,0.1);
}
.form-input::placeholder { color: #94A3B8; }

/* Input with icon */
.input-wrap { position: relative; }
.input-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: #94A3B8;
  pointer-events: none;
}
.input-icon svg { width: 16px; height: 16px; }
.input-wrap .form-input { padding-left: 38px; }

/* Submit */
.btn-login {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #1D4ED8, #2563EB);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(29,78,216,0.25);
  margin-top: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover {
  background: linear-gradient(135deg, #1A3FAA, #1D4ED8);
  box-shadow: 0 4px 16px rgba(29,78,216,0.35);
  transform: translateY(-1px);
}
.btn-login:active { transform: translateY(0); }

/* Footer */
.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11.5px;
  color: #94A3B8;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Attendly Schools">
    </div>
    <h1>Attendly Schools</h1>
    <p>Attendance Management System</p>
  </div>

  <div class="login-card">
    <div class="card-title">Sign in to your account</div>
    <div class="card-sub">Enter your username and password to continue</div>

    {% if error %}
    <div class="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="form-input" type="text" id="username" name="username"
                 placeholder="Enter your username" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>

  <div class="login-footer">
    &copy; 2026 Attendly Schools · Attendance Management System
  </div>
</div>

</body>
</html>
